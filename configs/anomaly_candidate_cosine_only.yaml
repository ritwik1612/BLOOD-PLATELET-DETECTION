# Candidate score: class-referenced latent distance only. It retains the fixed
# normal-only percentile calibration and the conservative RBC image guard.
weights:
  mse: 0.0
  cosine: 1.0
  confidence: 0.0
normalization:
  method: minmax
  epsilon: 1.0e-8
threshold:
  method: percentile
  percentile: 97.5
  std_multiplier: 3.0
  minimum_detection_confidence_for_abnormal: 0.10
  use_class_specific_calibration: false
image_relative_guard:
  enabled: true
  class_ids: [1]
  minimum_cells_per_class: 8
  mad_multiplier: 3.0
artifacts:
  centroids: outputs/weights/centroids.pt
  calibration: outputs/weights/anomaly_calibration_cosine_only.json
class_labels:
  0: WBC
  1: RBC
  2: Platelets
